name: Build AppImage

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl xz-utils cabextract msitools p7zip-full python3 file

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: build/cache
          key: downloads-${{ hashFiles('build.sh') }}

      - name: Build
        run: ./build.sh

      - name: Checksums
        run: sha256sum *.AppImage > SHA256SUMS && cat SHA256SUMS

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: |
            *.AppImage
            SHA256SUMS

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            # manual run: tag from the CK version in the file name plus the run number, e.g. v2.4.2-3
            ver="$(ls *.AppImage | sed -E 's/^HP_Prime_Connectivity_Kit-(.*)-x86_64\.AppImage$/\1/')"
            tag="v${ver}-${GITHUB_RUN_NUMBER}"
          fi
          gh release create "$tag" *.AppImage SHA256SUMS --target "$GITHUB_SHA" \
            --title "HP Prime Connectivity Kit ${tag#v} (AppImage)" \
            --notes "HP Connectivity Kit for Linux with bundled Wine. Install with Gear Lever: see the README.

          Built from ${GITHUB_SHA::7} by GitHub Actions."
