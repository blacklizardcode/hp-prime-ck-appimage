name: Build AppImage

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl xz-utils cabextract msitools p7zip-full python3 file

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: build/cache
          key: downloads-${{ hashFiles('build.sh') }}

      - name: Build
        run: ./build.sh

      - name: Checksums
        run: sha256sum *.AppImage > SHA256SUMS && cat SHA256SUMS

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: |
            *.AppImage
            SHA256SUMS

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" *.AppImage SHA256SUMS \
            --title "HP Prime Connectivity Kit ${GITHUB_REF_NAME#v} (AppImage)" \
            --notes "HP Connectivity Kit for Linux with bundled Wine. Install with Gear Lever: see the README.
          Built from ${GITHUB_SHA::7} by GitHub Actions."
